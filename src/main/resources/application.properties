spring.application.name=unisync

# ─────────────────────────────────────────
# MySQL Database Connection
# ─────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/smartcampus_db
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────
# JPA / Hibernate Settings
# ─────────────────────────────────────────
# update = auto-create/update tables based on entity changes (good for dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─────────────────────────────────────────
# File Upload Settings (for Attachment module)
# ─────────────────────────────────────────
# Max size for a single uploaded file
spring.servlet.multipart.max-file-size=5MB
# Max size for the entire request (all files combined)
spring.servlet.multipart.max-request-size=15MB

# ─────────────────────────────────────────
# Server Port
# ─────────────────────────────────────────
server.port=8080
